[package]
name = "vornel"
description = "Vornel — 跨平台 SSH / SFTP / RDP 客户端"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# 移动端（iOS）需要 staticlib；桌面端用 rlib
name = "vornel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
sha2 = "0.11"
vornel-core.workspace = true
vornel-ssh.workspace = true
vornel-sync.workspace = true
vornel-vault.workspace = true
