[package]
name = "vornel"
description = "Vornel — 跨平台 SSH / SFTP / RDP 客户端"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# 移动端（iOS）需要 staticlib；桌面端用 rlib
name = "vornel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
sha2 = "0.11"
vornel-core.workspace = true
vornel-mosh.workspace = true
vornel-remote.workspace = true
vornel-ssh.workspace = true
vornel-sync.workspace = true
vornel-term.workspace = true
vornel-vault.workspace = true

# 桌面端专用依赖
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
# 列出本机已安装的字体（字体包“单独调整”里可选）
fontdb = "0.24"
# 应用内自动更新与更新后重启（iOS 走 App Store）
# Windows 直接用签名过的 NSIS / MSI 安装包更新，不需要旧式 .zip 更新包，所以关掉 zip 特性
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-process = "2.4"

# IronRDP 的智能卡支持（sspi → winscard）经由 flate2 需要 zlib 的 C 库。
# iOS 的 Xcode 工程不链接系统 libz，因此在 iOS 上从源码静态编译 zlib，打进 Rust 静态库。
[target.'cfg(target_os = "ios")'.dependencies]
libz-sys = { version = "1.1", features = ["static"] }
