name: 界面截图（macOS / Windows）

# 在真实 macOS 上启动打包好的应用并截图，用来检查标题栏（红绿灯）等原生窗口细节。
# 复用 main 上发布打包留下的编译缓存。
on:
  push:
    branches: [develop]
    paths:
      - apps/vornel/src-tauri/tauri.conf.json
      - apps/vornel/src/App.svelte
      - apps/vornel/src/components/Sidebar.svelte
      - apps/vornel/src/components/TabBar.svelte
      - apps/vornel/src/components/WindowControls.svelte
      - apps/vornel/src-tauri/src/lib.rs
      - apps/vornel/src-tauri/Info.plist
      - .github/workflows/macos-shot.yml
  workflow_dispatch:

jobs:
  shot:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: vornel-macos-arm64
          save-if: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/vornel/package-lock.json
      - name: 打包 .app
        working-directory: apps/vornel
        env:
          # 与发布流程一致：整个应用 ad-hoc 签名，同时生成并签名更新包
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          npx tauri icon app-icon.svg
          npx tauri build --target aarch64-apple-darwin --bundles app
      - name: 检查本地网络权限说明已写入应用
        run: |
          APP=$(ls -d target/aarch64-apple-darwin/release/bundle/macos/*.app | head -1)
          plutil -extract NSLocalNetworkUsageDescription raw "$APP/Contents/Info.plist"
          # 整个 .app 必须签名（ad-hoc 即可），标识符为 bundle id，Info.plist 绑定进签名：
          # 否则 macOS 无法把“本地网络”权限与说明对应到这个应用，连局域网会报 No route to host
          codesign -dv "$APP" 2>&1 | tee /tmp/cs.txt
          grep -q "Identifier=com.lettimepassby.vornel" /tmp/cs.txt
          grep -q "Info.plist entries=" /tmp/cs.txt
          codesign --verify --deep --strict "$APP"

      - name: 启动并截图
        run: |
          APP=$(ls -d target/aarch64-apple-darwin/release/bundle/macos/*.app | head -1)
          open "$APP"
          sleep 12
          mkdir -p shots
          screencapture -x shots/full.png
          # 前台窗口左上角放大图，便于看红绿灯与顶栏是否对齐
          python3 - <<'PY'
          import subprocess, json
          out = subprocess.run(["osascript", "-e",
            'tell application "System Events" to tell (first process whose frontmost is true) to get {position, size} of window 1'],
            capture_output=True, text=True).stdout.strip()
          print("window:", out)
          x, y, w, h = [int(float(v)) for v in out.replace(" ", "").split(",")]
          subprocess.run(["screencapture", "-x", "-R", f"{x},{y},420,90", "shots/titlebar.png"], check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-shots
          path: shots/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: vornel-windows
          save-if: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/vornel/package-lock.json
      - name: 编译
        working-directory: apps/vornel
        shell: bash
        run: |
          npm ci
          npx tauri icon app-icon.svg
          npx tauri build --target x86_64-pc-windows-msvc --no-bundle
      - name: 启动并截图
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/vornel.exe"
          Start-Process $exe
          Start-Sleep -Seconds 15
          New-Item -ItemType Directory -Force shots | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("shots/windows.png")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-shots
          path: shots/
