name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: 前端检查与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vornel
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/vornel/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  crates:
    name: Rust 库（测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: crates
          # 只在 develop 上保存缓存，避免超过仓库 10 GB 上限后把打包用的缓存挤掉
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude vornel --all-targets
      - run: cargo test --workspace --exclude vornel
      - name: Mosh 端到端测试（连接真实的 mosh-server）
        run: |
          sudo apt-get update
          sudo apt-get install -y mosh
          cargo test -p vornel-mosh -- --ignored --nocapture
      - name: SSH 端到端测试（连接真实的 sshd）
        run: |
          set -euo pipefail
          sudo apt-get install -y openssh-server
          D=$RUNNER_TEMP/sshd; mkdir -p $D
          ssh-keygen -q -t ed25519 -N '' -f $D/host_key
          ssh-keygen -q -t ed25519 -N '' -C vornel-test -f $D/client_key
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          cat $D/client_key.pub >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
          cat > $D/sshd_config <<CFG
          Port 2222
          ListenAddress 127.0.0.1
          HostKey $D/host_key
          PidFile $D/sshd.pid
          AuthorizedKeysFile .ssh/authorized_keys
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          UsePAM no
          AllowTcpForwarding yes
          Subsystem sftp internal-sftp
          StrictModes no
          LogLevel DEBUG2
          CFG
          # 运行器账号的密码处于锁定状态；在 UsePAM no 时 sshd 会拒绝锁定账号的公钥登录
          sudo usermod -p '*' "$(whoami)"
          chmod 755 "$HOME"
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -f $D/sshd_config -E $D/sshd.log
          export VORNEL_TEST_SSH_PORT=2222 VORNEL_TEST_SSH_USER=$(whoami) VORNEL_TEST_SSH_KEY=$D/client_key
          cargo test -p vornel-ssh --test sshd -- --ignored --nocapture --test-threads=1 || { echo "----- sshd.log -----"; sudo cat $D/sshd.log | tail -80; exit 1; }

  app:
    name: Tauri 应用（检查）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Tauri 的 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: app
          # 只在 develop 上保存缓存，避免超过仓库 10 GB 上限后把打包用的缓存挤掉
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/vornel/package-lock.json

      - name: 生成应用图标
        working-directory: apps/vornel
        run: |
          npm ci
          npx tauri icon app-icon.svg

      - run: cargo clippy -p vornel --all-targets
      - run: cargo test -p vornel
