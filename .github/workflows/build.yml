name: Build

# - 手动触发：打包 macOS 与 Windows 安装包（含更新包与 .sig 签名），作为 Actions 产物上传（保留 14 天）
# - 推送 v* 标签：打包、正式发布 Release，并上传应用内更新清单 latest.json
#   （应用从 /releases/latest/download/latest.json 检查更新，所以 Release 不能是草稿）
# 更新包用仓库 Secret 里的 TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD 签名，
# 对应的公钥在 apps/vornel/src-tauri/tauri.conf.json 的 plugins.updater.pubkey。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS（通用版）
            os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact: vornel-macos
            paths: |
              target/universal-apple-darwin/release/bundle/dmg/*.dmg
              target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
              target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          - name: Windows
            os: windows-latest
            args: ''
            rust-targets: ''
            artifact: vornel-windows
            paths: |
              target/release/bundle/nsis/*.exe
              target/release/bundle/nsis/*.exe.sig
              target/release/bundle/msi/*.msi
              target/release/bundle/msi/*.msi.sig
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.artifact }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/vornel/package-lock.json

      - name: 安装前端依赖并生成图标
        working-directory: apps/vornel
        run: |
          npm ci
          npx tauri icon app-icon.svg

      - name: 打包并发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/vornel
          tagName: ${{ github.ref_name }}
          releaseName: Vornel ${{ github.ref_name }}
          releaseBody: 安装包见下方附件。已安装的 Vornel 会自动提示更新。macOS 版本暂未签名，首次打开请右键选择“打开”。
          releaseDraft: false
          prerelease: false
          # 生成 latest.json；Windows 用 NSIS 安装包更新
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      - name: 打包（仅生成产物）
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/vornel
          args: ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          retention-days: 14
          if-no-files-found: error
