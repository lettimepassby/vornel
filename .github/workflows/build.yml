name: Build

# 发布流程：改版本号（scripts/bump-version.mjs）并推送到 main → 自动打包并发布。
# - main 上的版本号还没有对应 Release 时：创建草稿 → 三个平台并行打包 → 生成 latest.json → 正式发布
# - main 上的版本号已发布过：跳过（普通合并不会重复打包）
# - 手动触发：只打包，产物上传到 Actions（保留 14 天），不发布
#
# 为什么在 main 上而不是标签上运行：GitHub 的缓存不在标签之间共享，标签触发每次都是冷编译；
# 在 main 上运行可以复用上一次发布的编译缓存。
#
# 更新包用仓库 Secret 里的 TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD 签名，
# 对应的公钥在 apps/vornel/src-tauri/tauri.conf.json 的 plugins.updater.pubkey。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 准备
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      release_id: ${{ steps.v.outputs.release_id }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          set -euo pipefail
          V=$(node -p "require('./apps/vornel/src-tauri/tauri.conf.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          STATE=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name==\"v$V\") | if .draft then \"draft:\(.id)\" else \"published\" end" | head -1)
          case "$STATE" in
            published)
              echo "v$V 已经发布过，跳过打包。"
              echo "publish=skip" >> "$GITHUB_OUTPUT" ;;
            draft:*)
              # 上一次发布中途失败留下的草稿，继续用它
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "release_id=${STATE#draft:}" >> "$GITHUB_OUTPUT" ;;
            *)
              # 直接从创建接口的返回里取 ID（创建后立刻查列表可能还查不到草稿）
              ID=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
                -f tag_name="v$V" -f target_commitish="$GITHUB_SHA" -f name="Vornel v$V" -F draft=true \
                -f body="安装包见下方附件。已安装的 Vornel 会自动提示更新。macOS 版本暂未签名，首次打开请右键选择“打开”。" \
                --jq .id)
              echo "已创建草稿 v$V（id=$ID）"
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "release_id=$ID" >> "$GITHUB_OUTPUT" ;;
          esac
          if grep -q '^publish=true' "$GITHUB_OUTPUT" && ! grep -qE '^release_id=[0-9]+$' "$GITHUB_OUTPUT"; then
            echo "::error::没有拿到草稿 Release 的 ID"; exit 1
          fi

  build:
    name: ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.publish != 'skip'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS（Apple 芯片）
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: vornel-macos-arm64
            paths: |
              target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz*
          - name: macOS（Intel）
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: vornel-macos-x64
            paths: |
              target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
              target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz*
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: vornel-windows
            paths: |
              target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe*
              target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi*
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.artifact }}
          # 只在 main 上保存，避免手动打包等占用缓存空间
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/vornel/package-lock.json

      - name: 安装前端依赖并生成图标
        working-directory: apps/vornel
        run: |
          npm ci
          npx tauri icon app-icon.svg

      - name: 打包并上传到草稿 Release
        if: needs.prepare.outputs.publish == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/vornel
          releaseId: ${{ needs.prepare.outputs.release_id }}
          # latest.json 由“发布”任务在三个平台都完成后统一生成，避免并行任务互相覆盖
          includeUpdaterJson: false
          args: --target ${{ matrix.target }}

      - name: 打包（仅生成产物）
        if: needs.prepare.outputs.publish != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/vornel
          args: --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        if: needs.prepare.outputs.publish != 'true'
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          retention-days: 14
          if-no-files-found: error

  publish:
    name: 生成更新清单并发布
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      V: ${{ needs.prepare.outputs.version }}
    steps:
      - name: 生成 latest.json
        run: |
          set -euo pipefail
          mkdir sigs && cd sigs
          gh release download "v$V" --repo "$GITHUB_REPOSITORY" --pattern '*.sig'
          ls -la
          python3 - <<'PY'
          import datetime, glob, json, os
          v = os.environ["V"]; repo = os.environ["GITHUB_REPOSITORY"]
          base = f"https://github.com/{repo}/releases/download/v{v}/"
          def entry(pattern):
              hits = sorted(glob.glob(pattern))
              if not hits:
                  raise SystemExit(f"缺少更新包签名：{pattern}")
              sig = hits[0]
              return {"signature": open(sig).read().strip(), "url": base + sig[: -len(".sig")]}
          platforms = {
              "darwin-aarch64": entry("*aarch64*.app.tar.gz.sig"),
              "darwin-x86_64": entry("*x64*.app.tar.gz.sig"),
              "windows-x86_64": entry("*-setup.exe.sig"),
          }
          json.dump({
              "version": v,
              "notes": "",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }, open("../latest.json", "w"), indent=2)
          print(json.dumps(platforms, indent=2)[:2000])
          PY

      - name: 上传并正式发布
        run: |
          set -euo pipefail
          gh release upload "v$V" latest.json --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "v$V" --draft=false --latest --repo "$GITHUB_REPOSITORY"
          echo "已发布 v$V"
