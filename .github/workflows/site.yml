name: 官网截图

# 用真实浏览器打开官网（site/public）截图并检查脚本错误、横向溢出。部署由维护者在本机执行（site/ 下 wrangler deploy）。
on:
  push:
    branches: [develop, main]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 启动本地静态服务
        run: |
          cd site/public
          python3 -m http.server 8788 >/dev/null 2>&1 &
          sleep 1
      - name: 截图
        run: |
          mkdir -p /tmp/shots && cp site/test/shots.mjs /tmp/shots/ && cd /tmp/shots
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node shots.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-shots
          path: /tmp/shots/shots/
