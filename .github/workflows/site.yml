name: 官网截图

# 检查生成的英文页是最新的；用真实浏览器打开官网（site/public）截图并检查脚本错误、横向溢出与搜索引擎标记。部署由维护者在本机执行（site/ 下 wrangler deploy）。
on:
  push:
    branches: [develop, main]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:
    inputs:
      url:
        description: 要截图的地址（留空则截本地 site/public）
        required: false

jobs:
  shots:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 英文页与结构化数据是最新的
        run: node site/build.mjs --check
      - name: 启动本地静态服务
        run: |
          cd site/public
          python3 -m http.server 8788 >/dev/null 2>&1 &
          sleep 1
      - name: 截图
        run: |
          mkdir -p /tmp/shots && cp site/test/shots.mjs /tmp/shots/ && cd /tmp/shots
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.65.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          SITE_URL="${{ inputs.url || 'http://127.0.0.1:8788' }}" node shots.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-shots
          path: /tmp/shots/shots/
